name: YZU Announcement Scraper

on:
  # 設定自動執行頻率：每 5 分鐘跑一次 (可改成 */10 代表每 10 分鐘)
  schedule:
    - cron: '*/5 * * * *'
  # 也可以手動在網頁上按鈕觸發
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests beautifulsoup4 firebase-admin PyGithub

      - name: 還原 Firebase 密鑰檔案
        run: |
          echo "${{ secrets.FIREBASE_KEY_JSON }}" > serviceAccountKey.json

      - name: 執行 Python 爬蟲
        run: |
          python crawler.py
        env:
          # GitHub 會自動提供 Token，讓你的程式可以把 announcements.json 推回倉庫
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
